ext.moduleName = 'stroom.shapeshifter.pipeline'

dependencies {

    // The adapter D10 named on 2026-08-17 and design 21 phase 0 created: the engine stays
    // Stroom-free, and this is the one module that knows both. It depends on stroom-pipeline
    // for the parser contract (xml.converter.AbstractParser, ParserFactory) and on the engine
    // to run configurations; nothing depends on it yet.
    implementation project(':stroom-pipeline')
    implementation project(':stroom-shapeshifter:stroom-shapeshifter-config')
    implementation project(':stroom-shapeshifter:stroom-shapeshifter-engine')
    // ErrorHandlerAdaptor's Severity and ElementId, and the hardened SAXParserFactory every
    // Stroom parser is built from.
    implementation project(':stroom-util')
    implementation project(':stroom-util-shared')
    // The document type (ShapeshifterDoc lives in stroom-core-shared so the explorer and the
    // client can see it), its store, its import/export and its REST resource.
    implementation project(':stroom-core-shared')
    implementation project(':stroom-docref')
    implementation project(':stroom-docstore:stroom-docstore-api')
    implementation project(':stroom-importexport:stroom-importexport-api')
    implementation project(':stroom-event-logging-rs:stroom-event-logging-rs-api')
    implementation project(':stroom-cache:stroom-cache-api')
    implementation project(':stroom-security:stroom-security-api')
    implementation project(':stroom-explorer:stroom-explorer-api')
    // Design 26 phase 3: what Stroom's context functions read — the feed's properties, the
    // data store's meta attributes and parts, dictionaries, the meta attribute map.
    implementation project(':stroom-feed:stroom-feed-api')
    implementation project(':stroom-data:stroom-data-store-api')
    implementation project(':stroom-dictionary:stroom-dictionary-api')
    implementation project(':stroom-meta:stroom-meta-api')
    // Phase 4: http-call and fetch-json run Stroom's own HTTP client.
    implementation libs.http.client

    // What a Stroom service module needs to be one: injection, Guice, logging, the REST
    // annotations the shared resource interface carries, and Saxon, because the pipeline's
    // ProcessException is an UncheckedXPathException.
    implementation libs.guice
    implementation libs.jakarta.inject
    implementation libs.restygwt
    implementation libs.saxon.he
    implementation libs.slf4j.api
    implementation libs.swagger.annotations
    implementation libs.ws.rs.api

    // The full-pipeline tests build real pipelines through PipelineFactory, whose task context
    // is the task API's.
    testImplementation project(':stroom-task:stroom-task-api')
    // The lookup tests build a FastInfoset value the way the reference data loader does.
    testImplementation libs.fast.infoset
    // The head-to-head against DS3 (design 45) lives here because this is the only module that
    // can see both engines — the same reason the golden test does. Benchmarks in src/test/java
    // as the engine and regex modules keep theirs.
    testImplementation libs.jmh.core
    testAnnotationProcessor libs.jmh.generator.annprocess
    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}

// The DS3 head-to-head. Same discipline as the engine's jmh task (D21): every run writes its
// full results to design/benchmarks as JSON, named by date and commit, because a number that
// exists only in scrollback cannot be compared with the next one.
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Run the DS3 head-to-head benchmark, recording results to design/benchmarks'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args = ['stroom.shapeshifter.pipeline.bench.Ds3HeadToHeadBenchmark.*']

    doFirst {
        final def results = file("${project.projectDir}/../design/benchmarks")
        results.mkdirs()
        final def stamp = new java.text.SimpleDateFormat('yyyy-MM-dd-HHmm').format(new Date())
        final def commit = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
        }.standardOutput.asText.get().trim()
        args = args + ['-rf', 'json',
                       '-rff', new File(results, "${stamp}-${commit}-ds3.json").path]
    }
}

// The demonstration content pack (design 44 §5r): the engine's fixtures as Shapeshifter
// documents, each carrying its own sample, in the layout a Stroom import reads. A task rather
// than a checked-in zip, so it follows the fixtures instead of going stale beside them.
tasks.register('contentPack', JavaExec) {
    group = 'build'
    description = 'Build a Stroom content pack of the fixture projects, with their samples'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'stroom.shapeshifter.pipeline.pack.ContentPackBuilder'
    // Beside the checkout rather than inside it: it is a build artefact to pick up and import,
    // not something to commit, and it is easier to find there than under a module's build dir.
    args = ["${rootProject.projectDir.parentFile}/shapeshifter-demos.zip"]
}

ext.moduleName = 'stroom.shapeshifter.regex'

dependencies {

    // JMH baseline benchmarks live in src/test/java, see stroom.shapeshifter.regex.bench.
    testImplementation libs.jmh.core
    testAnnotationProcessor libs.jmh.generator.annprocess

    testImplementation libs.bundles.common.test.implementation
    testRuntimeOnly libs.bundles.common.test.runtime
}

// The library promise, enforced rather than hoped: this module is usable standalone, so it
// has no runtime dependencies — only the JDK. Test scope (JUnit, JMH) is exempt. If a
// dependency ever appears, the build fails here with its name, and adding one becomes a
// decision somebody has to record rather than a transitive accident.
tasks.register('verifyZeroDependencies') {
    group = 'verification'
    description = 'Fails if stroom-shapeshifter-regex acquires any runtime dependency'
    // Resolved artifacts, not declared dependencies: the root build imposes BOM platforms on
    // every subproject, which constrain versions but carry no classes. The promise is about
    // classes — an empty runtime classpath — and this is the check that means exactly that.
    final def artifacts = provider {
        configurations.runtimeClasspath.files.collect { it.name }
    }
    doLast {
        if (!artifacts.get().isEmpty()) {
            throw new GradleException(
                    "stroom-shapeshifter-regex must have an empty runtime classpath; found: "
                    + artifacts.get())
        }
    }
}
tasks.named('check') { dependsOn 'verifyZeroDependencies' }

// Runs the JMH benchmarks. Pass JMH args through, e.g.
//   ./gradlew :stroom-shapeshifter:stroom-shapeshifter-regex:jmh --args='-prof gc'
//   ./gradlew :stroom-shapeshifter:stroom-shapeshifter-regex:jmh --args='.*PatternCorpus.*'
//
// Every run writes its full results to design/benchmarks as JSON, named by date and commit.
// That is deliberate: a throughput figure that exists only in a terminal scrollback cannot be
// compared with the next one, and comparing runs is the whole point — see decision D21, where a
// single-fork harness was shown to move 25% between runs of the same binary. The markdown tables
// in design/05-engine-benchmarks.md are rendered from these files by tools/render-benchmark.py
// rather than transcribed by hand.
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Run the Shapeshifter benchmarks, recording results to design/benchmarks'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args = ['stroom.shapeshifter.regex..*Benchmark.*']

    doFirst {
        final def results = file("${project.projectDir}/../design/benchmarks")
        results.mkdirs()
        final def stamp = new java.text.SimpleDateFormat('yyyy-MM-dd-HHmm').format(new Date())
        final def commit = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
        }.standardOutput.asText.get().trim()
        args = args + ['-rf', 'json',
                       '-rff', new File(results, "${stamp}-${commit}.json").path]
    }
}
